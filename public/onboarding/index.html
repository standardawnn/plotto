<!doctype html>
<html lang="ko">
<head><link rel="apple-touch-icon" href="/icons/v3-apple-touch-icon.png"/><link rel="icon" type="image/png" href="/favicon-192.png"/><link rel="manifest" href="/manifest.webmanifest"/>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plotto Onboarding</title>
<script src="/host.js"></script>
<link rel="stylesheet" href="onboarding.css">
<link rel="stylesheet" href="korean.css"><link rel="stylesheet" href="/responsive.css?v=2"><style>html[data-host="device"] .status{display:none!important}</style></head>
<body>
<main class="app">
  <section class="screen" id="screen" aria-roledescription="carousel" aria-label="Plotto onboarding">
    <img class="bg" src="assets/bg.png" alt="">

    <div class="status"><span>9:41</span><i></i><img src="/assets/intervention/8b917.svg" alt=""></div><div class="home-indicator"></div><header class="topbar">
      <button class="skip" id="skip" type="button" aria-label="이전 화면"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M16.136 3.363a.9.9 0 0 1 0 1.273L8.773 12l7.363 7.363a.9.9 0 1 1-1.272 1.273l-8-8a.9.9 0 0 1 0-1.273l8-8a.9.9 0 0 1 1.272 0Z" fill="currentColor"/></svg></button>
    <button class="skip-forward" id="skip-forward" type="button">건너뛰기</button></header>

    <div class="stage-wrap" id="stageWrap" aria-hidden="true">
      <div class="stage" id="stage"></div>
    </div>

    <div class="copy" id="copy">
      <article class="slide-copy" data-i="0">
        <h1>놓친 순간에도,<br>작업은 이어지도록</h1>
        <p>함께하지 못한 변화와 스케줄을 <img src="ui/logo-gray.svg" alt="plotto">가<br>확인하고, 필요한 일을 대신하고 알려드려요</p>
      </article>
      <article class="slide-copy" data-i="1">
        <h1>소통이 필요한 순간,<br><img src="ui/logo-black.svg" alt="plotto">가 함께</h1>
        <p>팀원과의 대화를 이어가도록,<br>관련 자료와 내용을 찾아 소통을 도와드려요</p>
      </article>
      <article class="slide-copy" data-i="2">
        <h1>같은 내용도,<br>각자의 맥락에 맞게</h1>
        <p>변경된 작업도 팀원과 프로젝트에 연결하여<br>서로에게 필요한 맥락으로 전달해요</p>
      </article>
    </div>

    <footer class="footer">
      <div class="dots" id="dots" role="tablist">
        <button type="button" role="tab" aria-label="Step 1"></button>
        <button type="button" role="tab" aria-label="Step 2"></button>
        <button type="button" role="tab" aria-label="Step 3"></button>
      </div>
      <button class="cta" id="cta" type="button">
        <span class="lbl" data-l="next">다음</span>
        <span class="lbl" data-l="start">다음</span>
      </button>
    </footer>
  </section>
</main>
<script src="assets/build/meta.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
